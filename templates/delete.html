<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>削除</title>
	<p>※ポートフォリオ用システム（デモ環境）</p>
	<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
	<h1>名前で部分検索して削除</h1>
	<div class="container">
		<form action="/delete" method="POST">
			<input type="text" name="keyword1" placeholder="名前の一部を入力">
			<input type="text" name="keyword2" placeholder="住所の一部を入力">
			<button type="submit">検索</button>
		</form>		

		{% if users %}
			<table border="1" style="margin-top:20px;">
				<tr>
					<th>ID</th>
					<th>名前</th>
					<th>電話</th>
					<th>住所</th>
					<th>削除</th>
				</tr>
				{% for u in users %}
				<tr>
					<td>{{ u[0] }}</td>
					<td>{{ u[1] }}</td>
					<td>{{ u[2] }}</td>
					<td>{{ u[3] }}</td>
					<td>
						<form action="{{ url_for('delete_confirm') }}" method="POST" style="display:inline;">
							<input type="hidden" name="id" value="{{ u[0] }}">
							<button type="submit">削除</button>
						</form>
					</td>
				</tr>
				{% endfor %}
			</table>
		{% endif %}
		<br><br>
		<a href="/" class="button-link">TOPへ戻る</a><br>
	</div>
</body>
</html>
